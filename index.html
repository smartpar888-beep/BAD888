<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Modela IoT Monitor</title>
    <style>
        body { font-family: 'Kanit', sans-serif; background: #f0f2f5; display: flex; justify-content: center; padding: 40px; }
        .card { background: white; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 380px; padding: 30px; text-align: center; }
        .label { color: #64748b; font-size: 0.9rem; margin-bottom: 5px; }
        .board-name { font-size: 1.4rem; font-weight: bold; color: #1e293b; margin-bottom: 20px; }
        .value-card { background: #eff6ff; border-radius: 12px; padding: 20px; margin-bottom: 20px; border: 1px solid #dbeafe; }
        .value { font-size: 3.5rem; font-weight: 800; color: #2563eb; }
        .unit { font-size: 1.1rem; color: #3b82f6; }
        .time { font-size: 0.8rem; color: #94a3b8; }
        button { width: 100%; padding: 12px; border: none; border-radius: 8px; background: #2563eb; color: white; cursor: pointer; font-size: 1rem; }
        button:hover { background: #1d4ed8; }
        .status-online { color: #10b981; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <div class="label">ชื่ออุปกรณ์</div>
    <div id="boardName" class="board-name">รอข้อมูล...</div>
    
    <div class="value-card">
        <div id="valueData" class="value">--</div>
        <div id="unitText" class="unit">หน่วย</div>
    </div>

    <div style="margin-bottom: 15px;">
        <span class="label">สถานะ:</span> <span id="connStatus" class="status-online">-</span>
    </div>

    <button onclick="fetchModelaData()">Refresh Data</button>
    <p id="lastUpdate" class="time">อัปเดตล่าสุด: -</p>
</div>

<script>
    // --- เปลี่ยนข้อมูลของคุณที่นี่ ---
    const CONFIG = {
        EMAIL: 'your_email', // 
        API_KEY: 'your_api_key' // 
    };

    async function fetchModelaData() {
        const url = `https://www.modelaaiot.com/api/external/v1/all-data/get_apiservice/${CONFIG.EMAIL}`;
        
        try {
            const response = await fetch(url, {
                method: 'GET',
                headers: {
                    'accept': 'application/json',
                    'authorization': CONFIG.API_KEY // ตามรูปแบบ curl ของ Modela
                }
            });

            if (!response.ok) throw new Error('เชื่อมต่อ API ไม่สำเร็จ');

            const data = await response.json();
            
            // ตรวจสอบว่ามีข้อมูลส่งกลับมาหรือไม่
            if (data && data.length > 0) {
                const device = data[0];
                const sensor = device.ValueSensor[0];

                // อัปเดต UI
                document.getElementById('boardName').innerText = device.boardName;
                document.getElementById('connStatus').innerText = device.connectionStatus.toUpperCase();
                document.getElementById('valueData').innerText = sensor.ValueData;
                document.getElementById('unitText').innerText = sensor.SensorTypeInfo.unit_thai;
                
                const now = new Date();
                document.getElementById('lastUpdate').innerText = "อัปเดตล่าสุด: " + now.toLocaleTimeString();
            }

        } catch (error) {
            console.error('Error:', error);
            alert('ไม่สามารถดึงข้อมูลได้: ' + error.message);
        }
    }

    // เรียกครั้งแรกตอนโหลดหน้า
    fetchModelaData();
    
    // ตั้ง Auto Refresh ทุก 1 นาที
    setInterval(fetchModelaData, 60000);
</script>

</body>
</html>
